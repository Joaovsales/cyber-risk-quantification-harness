schema_version: '1'
scenario_id: credential-phishing-bec
currency: USD
parameters:
  analysis_period_years: 1
  frequency:
    model: tef_x_vulnerability
    tef:
      label: Phishing emails reaching inboxes per year
      min: 150
      mode: 400
      max: 900
      unit: events/year
      provenance:
        tier: benchmark
        source_ids:
        - verizon-dbir
  vulnerability:
    model: direct_probability
    probability:
      label: Share of contacts that become a compromised account
      min: 0.01
      mode: 0.025
      max: 0.06
      unit: probability
      provenance:
        tier: benchmark
        source_ids:
        - verizon-dbir
  primary_loss:
    response:
      label: Incident response per event
      min: 8000
      mode: 25000
      max: 90000
      unit: USD
      provenance:
        tier: agent_assumption
        source_ids: []
        rationale: No incident response figures yet; a typical engagement is assumed.
    productivity:
      label: Lost productivity per event
      min: 2000
      mode: 10000
      max: 40000
      unit: USD
      provenance:
        tier: benchmark
        source_ids:
        - ibm-cost-of-breach
    replacement:
      label: Fraudulent transfer not recovered
      min: 0
      mode: 15000
      max: 400000
      unit: USD
      provenance:
        tier: agent_assumption
        source_ids: []
        rationale: Wire limits cap what a single fraudulent transfer can lose.
  secondary_loss:
    slef:
      label: Share of events with secondary effects
      min: 0.02
      mode: 0.08
      max: 0.25
      unit: events/event
      provenance:
        tier: agent_assumption
        source_ids: []
        rationale: Taken from the scenario narrative, not measured.
    reputation:
      label: Customer churn and reputation
      min: 20000
      mode: 100000
      max: 900000
      unit: USD
      provenance:
        tier: benchmark
        source_ids:
        - cyentia
    fines_and_judgments:
      label: Regulatory fines and legal
      min: 0
      mode: 50000
      max: 1200000
      unit: USD
      provenance:
        tier: benchmark
        source_ids:
        - cyentia
sources:
- id: verizon-dbir
  kind: benchmark_library
  title: Verizon DBIR 2025, social engineering
  url: https://www.verizon.com/business/resources/reports/dbir/
  retrieved_at: '2026-11-09'
- id: ibm-cost-of-breach
  kind: benchmark_library
  title: IBM Cost of a Data Breach 2025
  url: https://www.ibm.com/reports/data-breach
  retrieved_at: '2026-11-09'
- id: cyentia
  kind: benchmark_library
  title: Cyentia Institute research on cyber loss
  url: https://www.cyentia.com/research/
  retrieved_at: '2026-11-09'
variants:
- id: mfa
  label: Phishing-resistant MFA
  overrides:
    vulnerability.probability:
      label: Share of contacts that become a compromised account
      min: 0.0035
      mode: 0.00875
      max: 0.021
      unit: probability
      provenance:
        tier: agent_assumption
        source_ids: []
        rationale: Phishing-resistant MFA is assumed to cut the baseline probability by about 65 percent.
  annual_cost:
    label: Annual cost of phishing-resistant MFA
    min: 100000
    mode: 120000
    max: 140000
    unit: USD
    provenance:
      tier: agent_assumption
      source_ids: []
      rationale: Licence and rollout cost assumed for 800 employees.
