[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "risk-quantification-harness"
dynamic = ["version"]
description = "A FAIR-aligned cyber risk quantification harness: Claude Code skills plus the rqh command."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The risk-quantification-harness authors" }]
keywords = ["risk", "quantification", "monte-carlo", "cyber", "claude-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "jsonschema>=4.20",
  "PyYAML>=6.0",
  "Jinja2>=3.1.6",
  "MarkupSafe>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rqh = "rqharness.cli:entry"

[project.urls]
Repository = "https://github.com/Joaovsales/cyber-risk-quantification-harness"

[tool.hatch.version]
path = "src/rqharness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rqharness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
